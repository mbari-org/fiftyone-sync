# Batch sizes (fallbacks in code: media_id 200, localization 5000, embeddings 32)
media_id_batch_size: 500
localization_batch_size: 10000

# When true (enterprise): enable S3 upload and do not set fo.config.database_uri/database_name
# (FiftyOne uses its own config). When false: S3 upload disabled, sync sets database per project/port.
# The FiftyOne app URL is always taken directly from FIFTYONE_APP_PUBLIC_BASE_URL (no port suffix).
is_enterprise: true

embeddings:
  embeddings_field: "embeddings"
  # base brain key; UMAP is stored under `${brain_key}_umap`
  brain_key: "umap_viz"
  umap_seed: 51
  force_embeddings: false
  batch_size: 512
  force_umap: false
  # Similarity search (fob.compute_similarity): set similarity_brain_key to enable
  similarity_brain_key: "similarity_cosine"
  similarity_metric: "cosine"
  force_similarity: false
  service_url: "https://cortex.shore.mbari.org/vss/"

# Per-project VSS and S3 configuration.
# In enterprise mode, FiftyOne manages its own database — no databases: entry is needed.
# Each project entry requires:
#   vss_projects: (dict of named VSS configs, each with vss_project, s3_bucket, s3_prefix)
projects:
  "902004-Planktivore":
    vss_projects:
      high-mag:
        vss_project: "902004-Planktivore-HighMag"
        s3_bucket: "902004-planktivore-highmag"
        s3_prefix: "fiftyone/raw"
      low-mag:
        vss_project: "902004-Planktivore-LowMag"
        s3_bucket: "902004-planktivore-lowmag"
        s3_prefix: "fiftyone/raw"

# Near-duplicate / low-quality sample removal (CleanVision).
# Runs after the dataset is built and before embeddings, so pruned samples are never
# embedded. Only Voxel51 (FiftyOne) samples are deleted -- nothing is removed in Tator
# and the cropped image files are kept, so the crop cache stays valid.
cleanvision:
  # true = always prune; false = prune only when the `remove_near_duplicates` query
  # param is set (the "Remove near duplicates" checkbox in the launcher applet).
  enabled: false
  # true = report what would be removed without deleting anything.
  dry_run: false
  # Worker processes for image hashing/scoring (omit or null = CleanVision decides).
  n_jobs: null
  # CleanVision issue types and params. Map an issue type to null to switch it off.
  # near_duplicates groups by perceptual-hash collision: a smaller hash_size is coarser
  # and therefore more aggressive. One image is always kept per near-duplicate set
  # (the least blurry one).
  issue_types:
    low_information: {}
    dark: {}
    blurry:
      threshold: 0.52
    near_duplicates:
      hash_size: 4
      hash_type: phash
